name: Generate Jaipur to Ranthambore Taxi JPG
on:
  push:
    paths:
      - 'assets/images/gmb/source/jaipur-to-ranthambore-taxi.svg'
      - '.github/workflows/generate-jaipur-to-ranthambore-taxi-jpg.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render JPG
        run: |
          mkdir -p assets/images/gmb assets/images/blog
          convert assets/images/gmb/source/jaipur-to-ranthambore-taxi.svg -resize 1920x1080 -background white -alpha remove -alpha off -quality 95 assets/images/gmb/jaipur-to-ranthambore-taxi.jpg
          cp assets/images/gmb/jaipur-to-ranthambore-taxi.jpg assets/images/blog/jaipur-to-ranthambore-taxi.jpg
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/gmb/jaipur-to-ranthambore-taxi.jpg assets/images/blog/jaipur-to-ranthambore-taxi.jpg
          git diff --cached --quiet || git commit -m "Generate Jaipur to Ranthambore taxi HD image"
          git pull --rebase origin main
          git push origin HEAD:main
