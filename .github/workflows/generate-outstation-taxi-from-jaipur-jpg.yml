name: Generate Outstation Taxi Jaipur JPG
on:
  push:
    paths:
      - 'assets/images/gmb/source/outstation-taxi-from-jaipur.svg'
      - '.github/workflows/generate-outstation-taxi-from-jaipur-jpg.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Convert SVG to 16:9 HD JPG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          mkdir -p assets/images/gmb assets/images/blog
          rsvg-convert -w 1920 -h 1080 -o /tmp/outstation-taxi.png assets/images/gmb/source/outstation-taxi-from-jaipur.svg
          convert /tmp/outstation-taxi.png -background white -alpha remove -alpha off -sampling-factor 4:4:4 -quality 95 assets/images/gmb/outstation-taxi-from-jaipur.jpg
          cp assets/images/gmb/outstation-taxi-from-jaipur.jpg assets/images/blog/outstation-taxi-from-jaipur.jpg
      - name: Commit JPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/gmb/outstation-taxi-from-jaipur.jpg assets/images/blog/outstation-taxi-from-jaipur.jpg
          git diff --cached --quiet || git commit -m "Generate Outstation Taxi Jaipur HD image"
          git pull --rebase origin main
          git push origin HEAD:main
