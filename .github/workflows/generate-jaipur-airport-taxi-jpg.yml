name: Generate Jaipur Airport Taxi JPG

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/gmb/jaipur-airport-taxi-master.svg'
      - '.github/workflows/generate-jaipur-airport-taxi-jpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-jpg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render tools
        run: python -m pip install --quiet pillow cairosvg

      - name: Render full-resolution JPG
        run: |
          python - <<'PY'
          import io
          import cairosvg
          from PIL import Image

          src = "assets/images/gmb/jaipur-airport-taxi-master.svg"
          dst = "assets/images/gmb/jaipur-airport-taxi.jpg"

          png = cairosvg.svg2png(url=src, output_width=1600, output_height=1200)
          im = Image.open(io.BytesIO(png)).convert("RGB")
          assert im.size == (1600, 1200), im.size
          im.save(dst, "JPEG", quality=100, subsampling=0, optimize=True)
          print("Generated:", dst, "size:", im.size)
          PY

      - name: Commit generated JPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/gmb/jaipur-airport-taxi.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Jaipur Airport Taxi JPG in full quality"
          git push
