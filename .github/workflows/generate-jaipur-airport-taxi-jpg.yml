name: Generate Jaipur Airport Taxi JPG

on:
  push:
    branches: [main]
    paths:
      - 'blogs/images/jaipur-airport-taxi.webp'
      - '.github/workflows/generate-jaipur-airport-taxi-jpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-jpg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert WebP to JPG
        run: |
          mkdir -p assets/images/gmb
          python - <<'PY'
          from PIL import Image
          src = "blogs/images/jaipur-airport-taxi.webp"
          dst = "assets/images/gmb/jaipur-airport-taxi.jpg"
          im = Image.open(src).convert("RGB")
          im.thumbnail((1200, 1200))
          im.save(dst, "JPEG", quality=88, optimize=True, progressive=True)
          print(dst, im.size)
          PY

      - name: Commit generated JPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/gmb/jaipur-airport-taxi.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Generate Jaipur Airport Taxi JPG"
          git push
